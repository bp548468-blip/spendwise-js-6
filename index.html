<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BEATRICE'S SPENDWISE</h1>
    <p>Track your money smartly</p>
  </header>

  <main>
    <section class="card">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <input type="text" id="name" placeholder="Expense name e.g. Groceries" required>
        <input type="number" id="amount" placeholder="Amount (KSh)" min="1" required>
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Rent">Rent</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Airtime">Airtime</option>
        </select>
        <button type="submit">Add Expense</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Your Expenses</h2>
      <p><strong>Total Spent: KSh <span id="total">0</span></strong></p>
      <p id="status"></p>
      <table>
        <thead><tr><th>Name</th><th>Category</th><th>Amount</th><th>Action</th></tr></thead>
        <tbody id="expenseList"></tbody>
      </table>
      <button id="clearBtn">Clear All</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
